<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850" role="img" aria-labelledby="title desc"><title id="title">Daywise system architecture</title><desc id="desc">Photon messages, Google Calendar and optional Perceptron/location inputs feed persistent state and contextual features. A bounded language-model coordinator uses LinUCB-ranked options. A separate deterministic conflict planner produces approval proposals. Conditional Calendar updates require approval. Session feedback is saved in Supabase and updates weighted reward estimates.</desc><defs><pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="#0054b5" stroke-opacity=".05"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#6185b2" stroke-width="1.5"/></marker><linearGradient id="card-blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f0f6ff"/><stop offset="1" stop-color="#dcecff"/></linearGradient><linearGradient id="card-green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f1fbf5"/><stop offset="1" stop-color="#ddf3e5"/></linearGradient><linearGradient id="card-amber" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff8eb"/><stop offset="1" stop-color="#ffedcb"/></linearGradient><linearGradient id="card-cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eefbfc"/><stop offset="1" stop-color="#d7f0f5"/></linearGradient><linearGradient id="card-purple" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7759bd"/><stop offset="1" stop-color="#53368e"/></linearGradient><linearGradient id="card-model" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#237bd7"/><stop offset="1" stop-color="#0750a4"/></linearGradient><linearGradient id="card-coral" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff6ed"/><stop offset="1" stop-color="#ffe5d5"/></linearGradient><linearGradient id="card-mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f0fbef"/><stop offset="1" stop-color="#d8efde"/></linearGradient><linearGradient id="card-pink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff4fa"/><stop offset="1" stop-color="#fbe0ed"/></linearGradient><linearGradient id="card-storage" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#effbf6"/><stop offset="1" stop-color="#d6efe4"/></linearGradient></defs><rect width="1200" height="850" fill="#f8f9fb"/><rect width="1200" height="850" fill="url(#grid)"/><g font-family="Arial,sans-serif"><text x="30" y="40" fill="#0054b5" font-size="15" font-weight="700">DAYWISE / SYSTEM ARCHITECTURE</text><text x="30" y="63" fill="#69798d" font-size="12">Message ingestion → context/state → model + scheduling rules → approved execution → feedback update</text><path d="M300 157H390" fill="none" stroke="#627eaa" stroke-width="2" marker-end="url(#arrow)"/><path d="M300 322H340V190H390" fill="none" stroke="#627eaa" stroke-width="2" marker-end="url(#arrow)"/><path d="M300 500H390" fill="none" stroke="#627eaa" stroke-width="2" marker-end="url(#arrow)"/><path d="M555 220V305" fill="none" stroke="#627eaa" stroke-width="2" marker-end="url(#arrow)"/><text x="568" y="265" fill="#6b819d" font-size="10">19-feature encoder</text><path d="M720 157H840" fill="none" stroke="#627eaa" stroke-width="2" marker-end="url(#arrow)"/><path d="M720 365H790V205H840" fill="none" stroke="#627eaa" stroke-width="2" marker-end="url(#arrow)"/><text x="730" y="296" fill="#6b819d" font-size="10">ranked options</text><path d="M300 322H325V280H1005V315" fill="none" stroke="#627eaa" stroke-width="2" marker-end="url(#arrow)"/><text x="850" y="271" fill="#6b819d" font-size="10">busy intervals → overlap scan</text><path d="M1005 575V660" fill="none" stroke="#627eaa" stroke-width="2" marker-end="url(#arrow)"/><text x="1020" y="625" fill="#6b819d" font-size="10">pending proposal</text><path d="M1170 170H1185V735H1170" fill="none" stroke="#627eaa" stroke-width="2" marker-end="url(#arrow)"/><path d="M840 735H720" fill="none" stroke="#627eaa" stroke-width="2" marker-end="url(#arrow)"/><text x="742" y="722" fill="#6b819d" font-size="10">after session</text><path d="M390 735H300" fill="none" stroke="#627eaa" stroke-width="2" marker-end="url(#arrow)"/><path d="M165 660V620H555V575" fill="none" stroke="#627eaa" stroke-width="2" marker-end="url(#arrow)"/><text x="390" y="610" fill="#6b819d" font-size="10">train from your session outcomes</text><rect x="30" y="99" width="270" height="125" rx="16" fill="#123e6b" opacity=".04"/><rect x="30" y="95" width="270" height="125" rx="16" fill="url(#card-blue)" stroke="#125fbc" stroke-opacity=".35"/><text x="50" y="122" fill="#125fbc" font-size="10" letter-spacing="1">INPUT / MESSAGING</text><text x="50" y="150" fill="#153b61" font-size="18" font-weight="700">Photon + Spectrum</text><g transform="translate(258,104)"><rect x="-3" y="-2" width="30" height="30" rx="9" fill="#125fbc" opacity=".12"/><path d="M5 4h14v12H10l-5 4V4 M8 8h8 M8 12h5" fill="none" stroke="#125fbc" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="50" y="175" fill="#3f536a" font-size="12">The bot receives text and photos.</text><text x="50" y="197" fill="#3f536a" font-size="12">Messages belong to a conversation.</text><rect x="30" y="264" width="270" height="125" rx="16" fill="#123e6b" opacity=".04"/><rect x="30" y="260" width="270" height="125" rx="16" fill="url(#card-green)" stroke="#207858" stroke-opacity=".35"/><text x="50" y="287" fill="#207858" font-size="10" letter-spacing="1">INPUT / CALENDAR</text><text x="50" y="315" fill="#153b61" font-size="18" font-weight="700">Google Calendar API</text><g transform="translate(258,269)"><rect x="-3" y="-2" width="30" height="30" rx="9" fill="#207858" opacity=".12"/><path d="M5 6h14v14H5z M8 3v6 M16 3v6 M5 11h14 M9 14h2v2H9 M14 14h2v2h-2" fill="none" stroke="#207858" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="50" y="340" fill="#3f536a" font-size="12">Calendar returns events and busy times.</text><text x="50" y="362" fill="#3f536a" font-size="12">ETags detect changed events.</text><rect x="30" y="429" width="270" height="150" rx="16" fill="#123e6b" opacity=".04"/><rect x="30" y="425" width="270" height="150" rx="16" fill="url(#card-amber)" stroke="#986119" stroke-opacity=".35"/><text x="50" y="452" fill="#986119" font-size="10" letter-spacing="1">INPUT / OPTIONAL CONTEXT</text><text x="50" y="480" fill="#153b61" font-size="18" font-weight="700">Perceptron + location</text><g transform="translate(258,434)"><rect x="-3" y="-2" width="30" height="30" rx="9" fill="#986119" opacity=".12"/><path d="M4 8h4l2-3h5l2 3h3v12H4z M15 13a3 3 0 1 0 0 .1" fill="none" stroke="#986119" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="50" y="505" fill="#3f536a" font-size="12">Photos describe workspace conditions.</text><text x="50" y="527" fill="#3f536a" font-size="12">Location can identify a stable place.</text><text x="50" y="549" fill="#3f536a" font-size="12">Missing inputs stay unknown.</text><rect x="390" y="99" width="330" height="125" rx="16" fill="#123e6b" opacity=".04"/><rect x="390" y="95" width="330" height="125" rx="16" fill="url(#card-cyan)" stroke="#117080" stroke-opacity=".35"/><text x="410" y="122" fill="#117080" font-size="10" letter-spacing="1">RUNTIME / EVENT DETECTION</text><text x="410" y="150" fill="#153b61" font-size="18" font-weight="700">Persistent state + hard gates</text><g transform="translate(678,104)"><rect x="-3" y="-2" width="30" height="30" rx="9" fill="#117080" opacity=".12"/><path d="M3 12h4l3-7 4 14 3-7h4" fill="none" stroke="#117080" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="410" y="175" fill="#3f536a" font-size="12">The runtime keeps session and decision state.</text><text x="410" y="197" fill="#3f536a" font-size="12">Quiet hours and cooldowns gate prompts.</text><rect x="840" y="99" width="330" height="150" rx="16" fill="#123e6b" opacity=".04"/><rect x="840" y="95" width="330" height="150" rx="16" fill="url(#card-purple)" stroke="#6446a5" stroke-opacity=".35"/><text x="860" y="122" fill="#dfd7ff" font-size="10" letter-spacing="1">POLICY / LANGUAGE MODEL</text><text x="860" y="150" fill="#ffffff" font-size="18" font-weight="700">Bounded coordinator</text><g transform="translate(1128,104)"><rect x="-3" y="-2" width="30" height="30" rx="9" fill="#ffffff" opacity=".12"/><path d="M9 5a4 4 0 0 0-6 4 4 4 0 0 0 1 7 4 4 0 0 0 6 3 M15 5a4 4 0 0 1 6 4 4 4 0 0 1-1 7 4 4 0 0 1-6 3 M12 4v17 M7 10l5 3 5-3" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="860" y="175" fill="#e8f1ff" font-size="12">The LLM receives facts and ranked options.</text><text x="860" y="197" fill="#e8f1ff" font-size="12">Its response must match an action schema.</text><text x="860" y="219" fill="#e8f1ff" font-size="12">Only validated actions can run.</text><rect x="390" y="309" width="330" height="270" rx="16" fill="#123e6b" opacity=".04"/><rect x="390" y="305" width="330" height="270" rx="16" fill="url(#card-model)" stroke="#125fbc" stroke-opacity=".35"/><text x="410" y="332" fill="#bcd9ff" font-size="10" letter-spacing="1">TRAINED MODEL / PERSONALIZED REWARDS</text><text x="410" y="360" fill="#ffffff" font-size="18" font-weight="700">Weighted LinUCB</text><g transform="translate(678,314)"><rect x="-3" y="-2" width="30" height="30" rx="9" fill="#ffffff" opacity=".12"/><path d="M4 4v16h16 M7 15l4-5 4 2 5-7 M16 5h4v4" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="410" y="385" fill="#e8f1ff" font-size="12">Context encodes place, setup and duration.</text><text x="410" y="407" fill="#e8f1ff" font-size="12">Six flags identify missing input values.</text><text x="410" y="429" fill="#e8f1ff" font-size="12">Two fitted heads predict productivity and mood.</text><text x="410" y="451" fill="#e8f1ff" font-size="12">Utility uses 70% productivity and 30% mood.</text><text x="410" y="473" fill="#e8f1ff" font-size="12">An uncertainty bonus adds 0.2 × √(xᵀA⁻¹x).</text><text x="410" y="495" fill="#e8f1ff" font-size="12">Ratings are centered as y = (rating − 3) / 2.</text><text x="410" y="517" fill="#e8f1ff" font-size="12">New linked check-ins update reward estimates.</text><text x="410" y="539" fill="#e8f1ff" font-size="12">Time of day and subject are excluded.</text><rect x="840" y="319" width="330" height="260" rx="16" fill="#123e6b" opacity=".04"/><rect x="840" y="315" width="330" height="260" rx="16" fill="url(#card-coral)" stroke="#a64b2b" stroke-opacity=".35"/><text x="860" y="342" fill="#a64b2b" font-size="10" letter-spacing="1">RULES / CALENDAR CONFLICTS</text><text x="860" y="370" fill="#153b61" font-size="18" font-weight="700">Deterministic proposal planner</text><g transform="translate(1128,324)"><rect x="-3" y="-2" width="30" height="30" rx="9" fill="#a64b2b" opacity=".12"/><path d="M4 6h16 M4 12h16 M4 18h16 M8 3v6 M16 9v6 M10 15v6" fill="none" stroke="#a64b2b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="860" y="395" fill="#3f536a" font-size="12">Only eligible bot-created events can move.</text><text x="860" y="417" fill="#3f536a" font-size="12">The planner preserves duration and day.</text><text x="860" y="439" fill="#3f536a" font-size="12">It searches 8 AM–10 PM Pacific.</text><text x="860" y="461" fill="#3f536a" font-size="12">It requires ten-minute buffers.</text><text x="860" y="483" fill="#3f536a" font-size="12">It chooses the smallest time shift.</text><text x="860" y="505" fill="#3f536a" font-size="12">Invited and recurring events stay fixed.</text><rect x="840" y="664" width="330" height="150" rx="16" fill="#123e6b" opacity=".04"/><rect x="840" y="660" width="330" height="150" rx="16" fill="url(#card-mint)" stroke="#247344" stroke-opacity=".35"/><text x="860" y="687" fill="#247344" font-size="10" letter-spacing="1">EXECUTION / EXPLICIT PERMISSION</text><text x="860" y="715" fill="#153b61" font-size="18" font-weight="700">Approve / deny review</text><g transform="translate(1128,669)"><rect x="-3" y="-2" width="30" height="30" rx="9" fill="#247344" opacity=".12"/><path d="M12 3l8 3v6c0 5-8 9-8 9s-8-4-8-9V6z M8 12l3 3 5-6" fill="none" stroke="#247344" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="860" y="740" fill="#3f536a" font-size="12">A private expiring link shows the proposal.</text><text x="860" y="762" fill="#3f536a" font-size="12">Approval rechecks the event and destination.</text><text x="860" y="784" fill="#3f536a" font-size="12">A conditional PATCH applies the approved edit.</text><rect x="390" y="664" width="330" height="150" rx="16" fill="#123e6b" opacity=".04"/><rect x="390" y="660" width="330" height="150" rx="16" fill="url(#card-pink)" stroke="#a13a70" stroke-opacity=".35"/><text x="410" y="687" fill="#a13a70" font-size="10" letter-spacing="1">FEEDBACK / AFTER STUDYING</text><text x="410" y="715" fill="#153b61" font-size="18" font-weight="700">Productivity · mood · distraction</text><g transform="translate(678,669)"><rect x="-3" y="-2" width="30" height="30" rx="9" fill="#a13a70" opacity=".12"/><path d="M5 5h14v14H5z M8 9h1 M15 9h1 M8 13q4 5 8 0" fill="none" stroke="#a13a70" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="410" y="740" fill="#3f536a" font-size="12">The user gives three ratings from 1 to 5.</text><text x="410" y="762" fill="#3f536a" font-size="12">High-distraction interruptions get weight 0.25.</text><text x="410" y="784" fill="#3f536a" font-size="12">Other observations get weight 1 in updates.</text><rect x="30" y="664" width="270" height="150" rx="16" fill="#123e6b" opacity=".04"/><rect x="30" y="660" width="270" height="150" rx="16" fill="url(#card-storage)" stroke="#1c795b" stroke-opacity=".35"/><text x="50" y="687" fill="#1c795b" font-size="10" letter-spacing="1">STORAGE / PRIVATE HISTORY</text><text x="50" y="715" fill="#153b61" font-size="18" font-weight="700">Supabase</text><g transform="translate(258,669)"><rect x="-3" y="-2" width="30" height="30" rx="9" fill="#1c795b" opacity=".12"/><path d="M4 6c0-4 16-4 16 0s-16 4-16 0v12c0 4 16 4 16 0V6 M4 12c0 4 16 4 16 0" fill="none" stroke="#1c795b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="50" y="740" fill="#3f536a" font-size="12">Sessions link to completed feedback.</text><text x="50" y="762" fill="#3f536a" font-size="12">Each chat has a private dashboard.</text><text x="50" y="784" fill="#3f536a" font-size="12">Reports summarize saved model history.</text></g></svg>