<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1100" width="1200" height="1100" role="img" aria-labelledby="title desc"><title id="title">Daywise: conversational agent and automatic notifications</title><desc id="desc">Messages and calendar data feed a bounded tool-using agent. A separate scheduler sends morning briefs and event check-ins. Calendar proposals require permission and fresh checks. Feedback updates the personal reward model and dashboard.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#557394" stroke-width="1.5"/></marker></defs><rect width="1200" height="1100" rx="24" fill="#f5f8fc"/><g font-family="Arial,sans-serif"><text x="40" y="45" fill="#0054b5" font-size="16" font-weight="700">DAYWISE / HOW THE SYSTEM WORKS</text><text x="40" y="74" fill="#51677d" font-size="17">The language model chooses tools. Your personal reward model learns from ratings.</text><rect x="40" y="109" width="350" height="170" rx="18" fill="#163955" opacity=".05"/><rect x="40" y="105" width="350" height="170" rx="18" fill="#deecff" stroke="#93abc3" stroke-opacity=".4"/><circle cx="71" cy="136" r="15" fill="white" opacity=".8"/><text x="71" y="141" text-anchor="middle" fill="#17476c" font-size="15" font-weight="700">1</text><text x="95" y="141" fill="#315c7e" font-size="12" font-weight="700">INPUT / PHOTON + SPECTRUM</text><text x="62" y="177" fill="#173b59" font-size="21" font-weight="700">Text naturally.</text><text x="62" y="208" fill="#35536c" font-size="15">Messages keep their chat identity.</text><text x="62" y="231" fill="#35536c" font-size="15">Optional photos describe the workspace.</text><text x="62" y="254" fill="#35536c" font-size="15">Fresh location can identify a place.</text><rect x="425" y="109" width="350" height="170" rx="18" fill="#163955" opacity=".05"/><rect x="425" y="105" width="350" height="170" rx="18" fill="#fff0ce" stroke="#93abc3" stroke-opacity=".4"/><circle cx="456" cy="136" r="15" fill="white" opacity=".8"/><text x="456" y="141" text-anchor="middle" fill="#17476c" font-size="15" font-weight="700">◷</text><text x="480" y="141" fill="#315c7e" font-size="12" font-weight="700">BACKGROUND / PACIFIC TIME</text><text x="447" y="177" fill="#173b59" font-size="21" font-weight="700">Receive timely check-ins.</text><text x="447" y="208" fill="#35536c" font-size="15">The daily brief is at 8:30 a.m.</text><text x="447" y="231" fill="#35536c" font-size="15">Timed events get a 10-minute check-in.</text><text x="447" y="254" fill="#35536c" font-size="15">Quiet hours and opt-outs are respected.</text><rect x="810" y="109" width="350" height="170" rx="18" fill="#163955" opacity=".05"/><rect x="810" y="105" width="350" height="170" rx="18" fill="#dff4e9" stroke="#93abc3" stroke-opacity=".4"/><circle cx="841" cy="136" r="15" fill="white" opacity=".8"/><text x="841" y="141" text-anchor="middle" fill="#17476c" font-size="15" font-weight="700">▦</text><text x="865" y="141" fill="#315c7e" font-size="12" font-weight="700">TOOLS / GOOGLE CALENDAR</text><text x="832" y="177" fill="#173b59" font-size="21" font-weight="700">Read real availability.</text><text x="832" y="208" fill="#35536c" font-size="15">Events and busy intervals are live.</text><text x="832" y="231" fill="#35536c" font-size="15">Unknown data stays unknown.</text><text x="832" y="254" fill="#35536c" font-size="15">The connected calendar is shared.</text><path d="M215 275V310" fill="none" stroke="#557394" stroke-width="2" marker-end="url(#arrow)"/><path d="M600 275V310" fill="none" stroke="#557394" stroke-width="2" marker-end="url(#arrow)"/><path d="M985 275V310" fill="none" stroke="#557394" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="319" width="1120" height="225" rx="18" fill="#163955" opacity=".05"/><rect x="40" y="315" width="1120" height="225" rx="18" fill="#e9e1fa" stroke="#93abc3" stroke-opacity=".4"/><circle cx="71" cy="346" r="15" fill="white" opacity=".8"/><text x="71" y="351" text-anchor="middle" fill="#17476c" font-size="15" font-weight="700">✦</text><text x="95" y="351" fill="#315c7e" font-size="12" font-weight="700">REASONING / BOUNDED CONVERSATIONAL AGENT</text><text x="62" y="387" fill="#173b59" font-size="21" font-weight="700">Observe → choose a tool → inspect the result → respond.</text><text x="62" y="418" fill="#35536c" font-size="15">The model can read events, find openings, inspect learning estimates and retrieve confirmed session notes.</text><text x="62" y="441" fill="#35536c" font-size="15">It runs up to four decisions per message and remembers recent turns and the exact proposal it showed you.</text><text x="62" y="464" fill="#35536c" font-size="15">A follow-up such as “book it” confirms that proposal. Private dashboard codes stay outside the model.</text><text x="62" y="487" fill="#35536c" font-size="15">Scheduled briefs use calendar data directly. Conflict scanning and location prompting have separate rules.</text><text x="62" y="510" fill="#35536c" font-size="15">The language model is not fine-tuned. It reasons over retrieved facts and learned reward estimates.</text><path d="M215 540V585" fill="none" stroke="#557394" stroke-width="2" marker-end="url(#arrow)"/><path d="M390 687H425" fill="none" stroke="#557394" stroke-width="2" marker-end="url(#arrow)"/><path d="M775 687H810" fill="none" stroke="#557394" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="594" width="350" height="195" rx="18" fill="#163955" opacity=".05"/><rect x="40" y="590" width="350" height="195" rx="18" fill="#dceefa" stroke="#93abc3" stroke-opacity=".4"/><circle cx="71" cy="621" r="15" fill="white" opacity=".8"/><text x="71" y="626" text-anchor="middle" fill="#17476c" font-size="15" font-weight="700">✓</text><text x="95" y="626" fill="#315c7e" font-size="12" font-weight="700">POLICY / VALIDATION</text><text x="62" y="662" fill="#173b59" font-size="21" font-weight="700">Check before proposing.</text><text x="62" y="693" fill="#35536c" font-size="15">Only real openings can be offered.</text><text x="62" y="716" fill="#35536c" font-size="15">The conflict planner moves eligible</text><text x="62" y="739" fill="#35536c" font-size="15">bot-created events and preserves</text><text x="62" y="762" fill="#35536c" font-size="15">their duration and the same day.</text><rect x="425" y="594" width="350" height="195" rx="18" fill="#163955" opacity=".05"/><rect x="425" y="590" width="350" height="195" rx="18" fill="#ffe5df" stroke="#93abc3" stroke-opacity=".4"/><circle cx="456" cy="621" r="15" fill="white" opacity=".8"/><text x="456" y="626" text-anchor="middle" fill="#17476c" font-size="15" font-weight="700">↗</text><text x="480" y="626" fill="#315c7e" font-size="12" font-weight="700">PERMISSION / YOU DECIDE</text><text x="447" y="662" fill="#173b59" font-size="21" font-weight="700">Review and approve.</text><text x="447" y="693" fill="#35536c" font-size="15">Study bookings need confirmation.</text><text x="447" y="716" fill="#35536c" font-size="15">Conflict links explain old/new times.</text><text x="447" y="739" fill="#35536c" font-size="15">Nothing is moved automatically.</text><text x="447" y="762" fill="#35536c" font-size="15">A denial leaves Calendar unchanged.</text><rect x="810" y="594" width="350" height="195" rx="18" fill="#163955" opacity=".05"/><rect x="810" y="590" width="350" height="195" rx="18" fill="#dff2d6" stroke="#93abc3" stroke-opacity=".4"/><circle cx="841" cy="621" r="15" fill="white" opacity=".8"/><text x="841" y="626" text-anchor="middle" fill="#17476c" font-size="15" font-weight="700">✓</text><text x="865" y="626" fill="#315c7e" font-size="12" font-weight="700">EXECUTION / CALENDAR API</text><text x="832" y="662" fill="#173b59" font-size="21" font-weight="700">Recheck and verify.</text><text x="832" y="693" fill="#35536c" font-size="15">Booking checks fresh availability.</text><text x="832" y="716" fill="#35536c" font-size="15">Conflict edits check the event version.</text><text x="832" y="739" fill="#35536c" font-size="15">Stable IDs prevent duplicate bookings.</text><text x="832" y="762" fill="#35536c" font-size="15">Saved receipts feed review history.</text><path d="M985 785V830" fill="none" stroke="#557394" stroke-width="2" marker-end="url(#arrow)"/><path d="M810 930H775" fill="none" stroke="#557394" stroke-width="2" marker-end="url(#arrow)"/><path d="M425 930H390" fill="none" stroke="#557394" stroke-width="2" marker-end="url(#arrow)"/><rect x="810" y="839" width="350" height="215" rx="18" fill="#163955" opacity=".05"/><rect x="810" y="835" width="350" height="215" rx="18" fill="#fae2ee" stroke="#93abc3" stroke-opacity=".4"/><circle cx="841" cy="866" r="15" fill="white" opacity=".8"/><text x="841" y="871" text-anchor="middle" fill="#17476c" font-size="15" font-weight="700">♡</text><text x="865" y="871" fill="#315c7e" font-size="12" font-weight="700">OUTCOMES / AFTER STUDYING</text><text x="832" y="907" fill="#173b59" font-size="21" font-weight="700">Rate the actual session.</text><text x="832" y="938" fill="#35536c" font-size="15">Productivity, mood and distraction</text><text x="832" y="961" fill="#35536c" font-size="15">are recorded on a 1–5 scale.</text><text x="832" y="984" fill="#35536c" font-size="15">Confirmed notes add context.</text><text x="832" y="1007" fill="#35536c" font-size="15">They do not directly change scores.</text><rect x="425" y="839" width="350" height="215" rx="18" fill="#163955" opacity=".05"/><rect x="425" y="835" width="350" height="215" rx="18" fill="#dce9ff" stroke="#93abc3" stroke-opacity=".4"/><circle cx="456" cy="866" r="15" fill="white" opacity=".8"/><text x="456" y="871" text-anchor="middle" fill="#17476c" font-size="15" font-weight="700">↗</text><text x="480" y="871" fill="#315c7e" font-size="12" font-weight="700">TRAINING / WEIGHTED LINUCB</text><text x="447" y="907" fill="#173b59" font-size="21" font-weight="700">Update personal estimates.</text><text x="447" y="938" fill="#35536c" font-size="15">Context and ratings update the</text><text x="447" y="961" fill="#35536c" font-size="15">personal linear reward model.</text><text x="447" y="984" fill="#35536c" font-size="15">Interruption attribution affects weight.</text><text x="447" y="1007" fill="#35536c" font-size="15">Scores describe associations, not causes.</text><rect x="40" y="839" width="350" height="215" rx="18" fill="#163955" opacity=".05"/><rect x="40" y="835" width="350" height="215" rx="18" fill="#ddf2ec" stroke="#93abc3" stroke-opacity=".4"/><circle cx="71" cy="866" r="15" fill="white" opacity=".8"/><text x="71" y="871" text-anchor="middle" fill="#17476c" font-size="15" font-weight="700">▤</text><text x="95" y="871" fill="#315c7e" font-size="12" font-weight="700">STORAGE / DASHBOARD</text><text x="62" y="907" fill="#173b59" font-size="21" font-weight="700">Keep private history.</text><text x="62" y="938" fill="#35536c" font-size="15">Supabase stores sessions and ratings.</text><text x="62" y="961" fill="#35536c" font-size="15">Applied review receipts stay visible.</text><text x="62" y="984" fill="#35536c" font-size="15">The dashboard uses a private code.</text><text x="62" y="1007" fill="#35536c" font-size="15">The bot must run for notifications.</text><text x="40" y="1080" fill="#526b82" font-size="14">Calendar availability determines possible times. LinUCB does not currently learn a time-of-day productivity effect.</text></g></svg>