<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 580" width="1120" height="580" role="img" aria-labelledby="title desc">
<title id="title">The Daywise learning loop</title><desc id="desc">Messages, optional workspace context and Google Calendar feed a bounded coordinator. LinUCB estimates productivity and mood while calendar rules check availability. You approve or deny a proposal. Session ratings are saved privately in Supabase and used in future estimates.</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#0054b5" stroke-opacity=".06"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#6b94c4" stroke-width="1.5" stroke-linecap="round"/></marker></defs>
<rect width="1120" height="580" fill="#f8f9fb"/><rect width="1120" height="580" fill="url(#grid)"/>
<g fill="none" stroke="#6b94c4" stroke-width="1.5" marker-end="url(#arrow)"><path d="M304 163H397"/><path d="M304 324H350V190H397"/><path d="M710 163H797"/><path d="M555 242V293"/><path d="M710 355H752V204H797"/><path d="M950 242V408H910"/><path d="M650 495H403"/><path d="M400 465H555V423"/><path d="M400 465H170V386" stroke-dasharray="5 6"/></g>
<g font-family="Arial,sans-serif">
<rect x="35" y="83" width="269" height="150" rx="17" fill="white" stroke="#c5d3e4"/><text x="57" y="114" fill="#6283aa" font-size="10" letter-spacing="1.4">01 / CONTEXT</text><text x="57" y="145" fill="#0054b5" font-size="21" font-weight="700">A text. A little context.</text><text x="57" y="172" fill="#596879" font-size="12">Photon / Spectrum messaging</text><text x="57" y="194" fill="#596879" font-size="12">Perceptron photo tags + optional location</text><text x="57" y="214" fill="#7b8796" font-size="10">Unavailable context stays unknown.</text>
<rect x="35" y="265" width="269" height="121" rx="17" fill="white" stroke="#c5d3e4"/><text x="57" y="297" fill="#6283aa" font-size="10" letter-spacing="1.4">REAL AVAILABILITY</text><text x="57" y="328" fill="#0054b5" font-size="21" font-weight="700">Google Calendar</text><text x="57" y="355" fill="#596879" font-size="12">Busy times, open slots, conflicts</text>
<rect x="400" y="83" width="310" height="159" rx="17" fill="#0054b5"/><text x="424" y="114" fill="#bddcff" font-size="10" letter-spacing="1.4">02 / CONSIDER</text><text x="424" y="147" fill="white" font-size="23" font-weight="700">The bounded agent</text><text x="424" y="177" fill="#e0eeff" font-size="12">Understands your request.</text><text x="424" y="199" fill="#e0eeff" font-size="12">Chooses among permitted actions.</text><text x="424" y="221" fill="#bddcff" font-size="10">Checks rules before using a tool.</text>
<rect x="400" y="296" width="310" height="124" rx="17" fill="#e9f2ff" stroke="#a9c5e7"/><text x="424" y="328" fill="#0054b5" font-size="18" font-weight="700">Learned fit + calendar rules</text><text x="424" y="354" fill="#39597d" font-size="12">Weighted LinUCB: productivity + mood</text><text x="424" y="376" fill="#39597d" font-size="12">Availability: duration, conflicts, buffers</text><text x="424" y="400" fill="#627d9b" font-size="10">Estimates are patterns, not causal proof.</text>
<rect x="800" y="83" width="285" height="159" rx="17" fill="white" stroke="#c5d3e4"/><text x="824" y="114" fill="#6283aa" font-size="10" letter-spacing="1.4">03 / YOUR CALL</text><text x="824" y="147" fill="#0054b5" font-size="23" font-weight="700">A private review link</text><text x="824" y="177" fill="#596879" font-size="12">See why. Approve or deny.</text><text x="824" y="199" fill="#596879" font-size="12">Recheck before a Calendar edit.</text><text x="824" y="221" fill="#7b8796" font-size="10">Nothing moves without your approval.</text>
<rect x="650" y="438" width="435" height="105" rx="17" fill="#fff9ef" stroke="#e4d4b6"/><text x="674" y="468" fill="#a07736" font-size="10" letter-spacing="1.4">04 / YOUR EXPERIENCE</text><text x="674" y="497" fill="#685332" font-size="19" font-weight="700">Productivity · Mood · Distraction</text><text x="674" y="521" fill="#897657" font-size="12">Rate 1–5 after studying. Tell us what got in the way.</text>
<rect x="35" y="438" width="365" height="105" rx="17" fill="white" stroke="#c5d3e4"/><text x="57" y="468" fill="#6283aa" font-size="10" letter-spacing="1.4">PRIVATE MEMORY</text><text x="57" y="497" fill="#0054b5" font-size="19" font-weight="700">Supabase sessions + feedback</text><text x="57" y="521" fill="#596879" font-size="12">Owned history → future estimates + daily insights</text>
<text x="41" y="42" fill="#0054b5" font-size="11" letter-spacing="2">NOTICE → CONSIDER → ASK → LEARN</text><text x="418" y="461" fill="#6b849f" font-size="10">Feedback updates</text><text x="418" y="478" fill="#6b849f" font-size="10">the next estimate</text>
</g></svg>