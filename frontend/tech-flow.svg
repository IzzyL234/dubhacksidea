<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850" role="img" aria-labelledby="title desc"><title id="title">Daywise system architecture</title><desc id="desc">Photon messages, Google Calendar and optional Perceptron/location inputs feed persistent state and contextual features. A bounded language-model coordinator uses LinUCB-ranked options. A separate deterministic conflict planner produces approval proposals. Conditional Calendar updates require approval. Session feedback is saved in Supabase and updates weighted reward estimates.</desc><defs><pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="#0054b5" stroke-opacity=".05"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#6185b2" stroke-width="1.5"/></marker></defs><rect width="1200" height="850" fill="#f8f9fb"/><rect width="1200" height="850" fill="url(#grid)"/><g font-family="Arial,sans-serif"><text x="30" y="40" fill="#0054b5" font-size="15" font-weight="700">DAYWISE / SYSTEM ARCHITECTURE</text><text x="30" y="63" fill="#69798d" font-size="12">Message ingestion → context/state → model + scheduling rules → approved execution → feedback update</text><path d="M300 157H390" fill="none" stroke="#6185b2" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M300 322H340V190H390" fill="none" stroke="#6185b2" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M300 500H390" fill="none" stroke="#6185b2" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M555 220V305" fill="none" stroke="#6185b2" stroke-width="1.5" marker-end="url(#arrow)"/><text x="568" y="265" fill="#6b819d" font-size="10">19-feature encoder</text><path d="M720 157H840" fill="none" stroke="#6185b2" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M720 365H790V205H840" fill="none" stroke="#6185b2" stroke-width="1.5" marker-end="url(#arrow)"/><text x="730" y="296" fill="#6b819d" font-size="10">ranked options</text><path d="M300 322H325V280H1005V315" fill="none" stroke="#6185b2" stroke-width="1.5" marker-end="url(#arrow)"/><text x="850" y="271" fill="#6b819d" font-size="10">busy intervals → overlap scan</text><path d="M1005 575V660" fill="none" stroke="#6185b2" stroke-width="1.5" marker-end="url(#arrow)"/><text x="1020" y="625" fill="#6b819d" font-size="10">pending proposal</text><path d="M1170 170H1185V735H1170" fill="none" stroke="#6185b2" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M840 735H720" fill="none" stroke="#6185b2" stroke-width="1.5" marker-end="url(#arrow)"/><text x="742" y="722" fill="#6b819d" font-size="10">after session</text><path d="M390 735H300" fill="none" stroke="#6185b2" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M165 660V620H555V575" fill="none" stroke="#6185b2" stroke-width="1.5" marker-end="url(#arrow)"/><text x="390" y="610" fill="#6b819d" font-size="10">owned, linked feedback</text><rect x="30" y="95" width="270" height="125" rx="13" fill="#ffffff" stroke="#c5d3e4"/><text x="50" y="122" fill="#7085a0" font-size="10" letter-spacing="1">INPUT / MESSAGING</text><text x="50" y="150" fill="#0054b5" font-size="18" font-weight="700">Photon + Spectrum</text><text x="50" y="175" fill="#516176" font-size="12">Inbound text, commands, photos</text><text x="50" y="197" fill="#516176" font-size="12">Conversation identity + message ID</text><rect x="30" y="260" width="270" height="125" rx="13" fill="#ffffff" stroke="#c5d3e4"/><text x="50" y="287" fill="#7085a0" font-size="10" letter-spacing="1">INPUT / CALENDAR</text><text x="50" y="315" fill="#0054b5" font-size="18" font-weight="700">Google Calendar API</text><text x="50" y="340" fill="#516176" font-size="12">Busy intervals + event metadata</text><text x="50" y="362" fill="#516176" font-size="12">ETags for conditional writes</text><rect x="30" y="425" width="270" height="150" rx="13" fill="#ffffff" stroke="#c5d3e4"/><text x="50" y="452" fill="#7085a0" font-size="10" letter-spacing="1">INPUT / OPTIONAL CONTEXT</text><text x="50" y="480" fill="#0054b5" font-size="18" font-weight="700">Perceptron + location</text><text x="50" y="505" fill="#516176" font-size="12">Photo → clutter, lighting, ergonomics</text><text x="50" y="527" fill="#516176" font-size="12">Location → stable place evidence</text><text x="50" y="549" fill="#516176" font-size="12">Missing signals stay unknown</text><rect x="390" y="95" width="330" height="125" rx="13" fill="#ffffff" stroke="#c5d3e4"/><text x="410" y="122" fill="#7085a0" font-size="10" letter-spacing="1">RUNTIME / EVENT DETECTION</text><text x="410" y="150" fill="#0054b5" font-size="18" font-weight="700">Persistent state + hard gates</text><text x="410" y="175" fill="#516176" font-size="12">Session state, prior decisions, cooldowns</text><text x="410" y="197" fill="#516176" font-size="12">Quiet hours, context freshness, call budget</text><rect x="840" y="95" width="330" height="150" rx="13" fill="#0054b5" stroke="#0054b5"/><text x="860" y="122" fill="#bcd9ff" font-size="10" letter-spacing="1">POLICY / LANGUAGE MODEL</text><text x="860" y="150" fill="#ffffff" font-size="18" font-weight="700">Bounded coordinator</text><text x="860" y="175" fill="#dfedff" font-size="12">Structured facts + allowed option IDs</text><text x="860" y="197" fill="#dfedff" font-size="12">stay_quiet / offer_study</text><text x="860" y="219" fill="#dfedff" font-size="12">ask_place / check_in</text><rect x="390" y="305" width="330" height="270" rx="13" fill="#ffffff" stroke="#c5d3e4"/><text x="410" y="332" fill="#7085a0" font-size="10" letter-spacing="1">LEARNING / CONTEXTUAL BANDIT</text><text x="410" y="360" fill="#0054b5" font-size="18" font-weight="700">Weighted LinUCB</text><text x="410" y="385" fill="#516176" font-size="12">x: place, setup, environment, duration</text><text x="410" y="407" fill="#516176" font-size="12">+ six missing-value indicators</text><text x="410" y="429" fill="#516176" font-size="12">Two ridge estimates: productivity + mood</text><text x="410" y="451" fill="#516176" font-size="12">Utility: 0.7 productivity + 0.3 mood</text><text x="410" y="473" fill="#516176" font-size="12">UCB bonus: 0.2 × √(xᵀA⁻¹x)</text><text x="410" y="495" fill="#516176" font-size="12">Ratings centered: y = (rating − 3) / 2</text><text x="410" y="517" fill="#516176" font-size="12">Starter examples + owned feedback</text><text x="410" y="539" fill="#516176" font-size="12">No hour-of-day or subject features</text><rect x="840" y="315" width="330" height="260" rx="13" fill="#ffffff" stroke="#c5d3e4"/><text x="860" y="342" fill="#7085a0" font-size="10" letter-spacing="1">RULES / CALENDAR CONFLICTS</text><text x="860" y="370" fill="#0054b5" font-size="18" font-weight="700">Deterministic proposal planner</text><text x="860" y="395" fill="#516176" font-size="12">Move only eligible bot-created events</text><text x="860" y="417" fill="#516176" font-size="12">Preserve duration; same-day search</text><text x="860" y="439" fill="#516176" font-size="12">8 AM–10 PM Pacific; 10-minute buffers</text><text x="860" y="461" fill="#516176" font-size="12">Choose the minimum time shift</text><text x="860" y="483" fill="#516176" font-size="12">Invited/recurring events stay fixed</text><text x="860" y="505" fill="#516176" font-size="12">No learned time-of-day claim</text><rect x="840" y="660" width="330" height="150" rx="13" fill="#ffffff" stroke="#c5d3e4"/><text x="860" y="687" fill="#7085a0" font-size="10" letter-spacing="1">EXECUTION / EXPLICIT PERMISSION</text><text x="860" y="715" fill="#0054b5" font-size="18" font-weight="700">Approve / deny review</text><text x="860" y="740" fill="#516176" font-size="12">Private, expiring per-proposal link</text><text x="860" y="762" fill="#516176" font-size="12">Recheck ETag, conflict and destination</text><text x="860" y="784" fill="#516176" font-size="12">Conditional PATCH; idempotent retry</text><rect x="390" y="660" width="330" height="150" rx="13" fill="#ffffff" stroke="#c5d3e4"/><text x="410" y="687" fill="#7085a0" font-size="10" letter-spacing="1">FEEDBACK / AFTER STUDYING</text><text x="410" y="715" fill="#0054b5" font-size="18" font-weight="700">Productivity · mood · distraction</text><text x="410" y="740" fill="#516176" font-size="12">Collect three ratings from 1 to 5</text><text x="410" y="762" fill="#516176" font-size="12">High-distraction interruption → w=0.25</text><text x="410" y="784" fill="#516176" font-size="12">Otherwise w=1; update A and reward sums</text><rect x="30" y="660" width="270" height="150" rx="13" fill="#ffffff" stroke="#c5d3e4"/><text x="50" y="687" fill="#7085a0" font-size="10" letter-spacing="1">STORAGE / PRIVATE HISTORY</text><text x="50" y="715" fill="#0054b5" font-size="18" font-weight="700">Supabase</text><text x="50" y="740" fill="#516176" font-size="12">Linked sessions + feedback</text><text x="50" y="762" fill="#516176" font-size="12">Conversation-scoped dashboard</text><text x="50" y="784" fill="#516176" font-size="12">Persisted reports + model history</text></g></svg>